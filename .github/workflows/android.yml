name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant"
        required: true
        default: "release"
        type: choice
        options: [release, debug]

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `android-actions/setup-android@v3` is deliberately not used: its
      # post-install step runs `sdkmanager tools`, a package that no longer
      # exists in the SDK repository, which aborts the job. The ubuntu runner
      # already ships the SDK, so the required pieces are installed explicitly.
      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK at $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # Installs Gradle 8.11.1 and puts `gradle` on PATH. The build is driven
      # through the CLI rather than ./gradlew because the wrapper jar is a
      # binary and is intentionally not committed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build with Gradle
        run: |
          if [ "${{ github.event.inputs.build_type || 'release' }}" = "debug" ]; then
            gradle :app:assembleDebug --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deeperseeker-android-${{ github.sha }}
          path: android/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # On a tag push, attach the APK to a GitHub Release so users can install
      # it directly without digging through the Actions artifacts UI.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true