<!DOCTYPE html>
<html lang="{{ 'zh-CN' if lang() == 'zh' else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DeeperSeeker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">{{ _('nav_dashboard') }}</a>
        <span class="sep">|</span>
        <a href="/logout">{{ _('nav_logout') }}</a>
        <span class="sep">|</span>
        <span class="brand">DeeperSeeker</span>
        <span class="lang-switch">
            <a href="?lang=zh">{{ _('lang_zh') }}</a> / <a href="?lang=en">{{ _('lang_en') }}</a>
        </span>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
