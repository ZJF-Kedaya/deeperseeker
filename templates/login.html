{% extends "base.html" %}
{% block title %}Login - DeeperSeeker{% endblock %}
{% block content %}
<h1>{{ _('login_title') }}</h1>
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
<form method="post" action="/login">
    <div style="margin-bottom:10px;">
        <input type="text" name="username" placeholder="{{ _('username') }}" required style="width:300px;">
    </div>
    <div style="margin-bottom:10px;">
        <input type="password" name="password" placeholder="{{ _('password') }}" required style="width:300px;">
    </div>
    <button type="submit">{{ _('login_button') }}</button>
</form>
{% endblock %}
